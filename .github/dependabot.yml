version: 2
multi-ecosystem-groups:
  ci-tooling:
    schedule:
      interval: monthly
    assignees:
      - camUrban
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: ci-tooling
    cooldown:
      default-days: 7
  - package-ecosystem: pre-commit
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: ci-tooling
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    assignees:
      - camUrban
