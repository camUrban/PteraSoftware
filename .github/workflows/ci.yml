name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dependency-set: ["min", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_min.txt
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
      - name: Install minimum dependencies
        if: ${{ matrix.dependency-set == 'min' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_min.txt
      - name: Install latest dependencies
        if: ${{ matrix.dependency-set == 'latest' && matrix.python-version != '3.14' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install latest dependencies and Codecov
        if: ${{ matrix.dependency-set == 'latest' && matrix.python-version == '3.14' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt codecov
      - name: Run tests without coverage
        if: ${{ !(matrix.python-version == '3.14' && matrix.dependency-set == 'latest') }}
        run: |
          python -m unittest discover -s tests
      - name: Run tests with coverage and generate coverage report
        if: ${{ matrix.python-version == '3.14' && matrix.dependency-set == 'latest' }}
        env:
          NUMBA_JIT_COVERAGE: "1"
        run: |
          coverage run --source=pterasoftware -m unittest discover -s tests
          coverage xml -o coverage.xml
      - name: Upload coverage report to Codecov
        if: ${{ matrix.python-version == '3.14' && matrix.dependency-set == 'latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt
      # Run each linter and formatter through pre-commit so CI uses the exact
      # frozen hook versions from .pre-commit-config.yaml and only ever sees
      # tracked files. The mypy hook runs with language: system, so its
      # version comes from the requirements_dev.txt install above rather
      # than a frozen rev. The pinned-versions hook stays out of CI by
      # design: a fresh runner that just installed the requirements files
      # would pass it trivially.
      - name: isort
        run: pre-commit run --all-files isort
      - name: black
        run: pre-commit run --all-files black
      - name: codespell
        run: pre-commit run --all-files codespell
      - name: docformatter
        run: pre-commit run --all-files docformatter
      - name: octowrap-check
        run: pre-commit run --all-files octowrap-check
      - name: mypy
        run: pre-commit run --all-files mypy
