name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dependency-set: ["min", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_min.txt
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
      - name: Install minimum dependencies
        if: ${{ matrix.dependency-set == 'min' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_min.txt
      - name: Install latest dependencies
        if: ${{ matrix.dependency-set == 'latest' && matrix.python-version != '3.14' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install latest dependencies and Codecov
        if: ${{ matrix.dependency-set == 'latest' && matrix.python-version == '3.14' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt codecov
      - name: Run tests without coverage
        if: ${{ !(matrix.python-version == '3.14' && matrix.dependency-set == 'latest') }}
        run: |
          python -m unittest discover -s tests
      - name: Run tests with coverage and generate coverage report
        if: ${{ matrix.python-version == '3.14' && matrix.dependency-set == 'latest' }}
        env:
          NUMBA_JIT_COVERAGE: "1"
        run: |
          coverage run --source=pterasoftware -m unittest discover -s tests
          coverage xml -o coverage.xml
      - name: Upload coverage report to Codecov
        if: ${{ matrix.python-version == '3.14' && matrix.dependency-set == 'latest' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt
      # Run each linter and formatter through pre-commit so CI uses the exact
      # frozen hook versions from .pre-commit-config.yaml and only ever sees
      # tracked files. The octowrap and mypy hooks run with language: system,
      # so their versions come from the requirements_dev.txt install above
      # rather than a frozen rev. The pinned-versions hook stays out of CI by
      # design: a fresh runner that just installed the requirements files
      # would pass it trivially.
      - name: isort
        run: pre-commit run --all-files isort
      - name: black
        run: pre-commit run --all-files black
      - name: codespell
        run: pre-commit run --all-files codespell
      - name: docformatter
        run: pre-commit run --all-files docformatter
      - name: octowrap
        run: pre-commit run --all-files octowrap
      - name: mypy
        run: pre-commit run --all-files mypy
