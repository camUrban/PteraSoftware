repos:
  # Fixers: normalize bytes first so later hooks see clean files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: fixer    end-of-files
      - id: trailing-whitespace
        name: fixer    trailing-whitespace
      - id: mixed-line-ending
        name: fixer    mixed-line-endings
        args: [--fix=lf]
      - id: fix-byte-order-marker
        name: fixer    byte-order-marks
      - id: requirements-txt-fixer
        name: fixer    requirements-txt
  # Auto-formatters: rewrite code on top of the normalized bytes.
  - repo: https://github.com/pycqa/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a  # frozen: 8.0.1a3
    hooks:
      - id: isort
        name: fixer    isort
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # frozen: 26.5.1
    hooks:
      - id: black
        name: fixer    black
  - repo: https://github.com/PyCQA/docformatter
    rev: 0032269a0e65c068af9cd86c9a8859a0ddd568d6  # frozen: v1.7.8
    hooks:
      - id: docformatter
        name: fixer    docformatter
        additional_dependencies: [tomli]
        args: [--in-place, --config, ./pyproject.toml]
        files: ^(pterasoftware|examples|scripts|tests|validation|docs)/
  # Validators: read-only, run against the final state.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: checker  merge-conflicts
      - id: check-case-conflict
        name: checker  case-conflicts
      - id: check-illegal-windows-names
        name: checker  illegal-names
      - id: check-symlinks
        name: checker  lost-symlinks
      - id: destroyed-symlinks
        name: checker  destroyed-symlinks
      - id: check-yaml
        name: checker  yaml-files
      - id: check-toml
        name: checker  toml-files
      - id: check-xml
        name: checker  xml-files
      - id: check-json
        name: checker  json-files
      - id: detect-private-key
        name: checker  private-keys
      - id: forbid-submodules
        name: checker  submodules
      - id: check-vcs-permalinks
        name: checker  vcs-permalinks
      - id: check-executables-have-shebangs
        name: checker  exec-shebangs
      - id: check-shebang-scripts-are-executable
        name: checker  shebang-execs
      - id: check-added-large-files
        name: checker  large-files
        # The reference output tree holds rendered animations (webp) and plots that
        # exceed the default 500 KB ceiling. Exclude it so example artifacts can be
        # committed without raising the global limit.
        exclude: ^docs/examples_expected_output/
      - id: debug-statements
        name: checker  debug-statements
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        name: checker  codespell
        # The rendered HTML reports embed base64-encoded TTFs. Random byte sequences in
        # the base64 stream collide with codespell's small typo dictionary (e.g., AEr,
        # ABL, gEs), so exclude the reports tree where these blobs live.
        exclude: ^docs/_static/benchmarks/.*\.html$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
    hooks:
      - id: zizmor
        name: checker  zizmor
  - repo: https://github.com/camUrban/octowrap
    rev: 5df77a33ceadd9a849d7a8c0d22fa7468bba3906  # frozen: v0.7.0
    hooks:
      # On failure, octowrap prints the fix commands, built from the interpreter in
      # pre-commit's cached hook environment so the interactive fix runs against this
      # exact pinned copy.
      - id: octowrap-check
        name: checker  octowrap-check
  - repo: local
    hooks:
      # The hooks in this repo run with language: system, so pre-commit executes
      # whatever tool versions the active environment holds instead of managing pinned
      # copies itself. This check runs first and fails when those versions have drifted
      # from the exact pins in requirements_dev.txt.
      - id: pinned-versions
        name: checker  pinned-versions
        entry: python scripts/check_pinned_versions.py
        language: system
        always_run: true
        pass_filenames: false
      - id: ascii-only
        name: checker  ascii-only
        entry: python scripts/check_ascii_only.py
        language: system
        types: [text]
        exclude: '\.(svg|ui)$'
      - id: mypy
        name: checker  mypy
        entry: mypy pterasoftware examples scripts tests validation docs/website
        language: system
        always_run: true
        pass_filenames: false
