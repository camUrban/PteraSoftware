[metadata]
name = PteraSoftware
version = 5.1.0
author = Cameron Urban
author_email = camerongurban@gmail.com
license = MIT
description = This is an open-source, unsteady aerodynamics solver for analyzing flapping-wing flight.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/camurban/pterasoftware
project_urls =
    Bug Tracker = https://github.com/camurban/pterasoftware/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Visualization
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Operating System :: OS Independent
    Typing :: Typed
keywords =
    python
    simulation
    aerospace
    aerodynamics
    aeronautics
    aircraft-design
    flight-dynamics
    cfd
    potential-flow
    panel-method
    vlm
    uvlm
    vortex-lattice-method
    unsteady-flows
    uav
    micro-air-vehicle
    ornithopter
    flapping-wing
    flapping-flight
    bio-inspired-robotics

[options]
packages =
    pterasoftware
    pterasoftware.geometry
    pterasoftware.movements
include_package_data = True
python_requires = >= 3.11.0, < 3.15.0
install_requires =
    matplotlib >= 3.10.5, < 4.0.0
    mujoco >= 3.8.0, < 4.0.0
    numba >= 0.63.0, < 1.0.0
    numpy >= 2.3.2, < 3.0.0
    pyvista >= 0.45.0, < 1.0.0
    scipy >= 1.16.1, < 2.0.0
    threadpoolctl >= 3.5.0, < 4.0.0
    tqdm >= 4.66.3, < 5.0.0
    webp >= 0.4.0, < 1.0.0
